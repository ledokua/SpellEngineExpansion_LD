plugins {
    id 'fabric-loom' version '1.18-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { name = "Modrinth"; url = "https://api.modrinth.com/maven"; content { includeGroup "maven.modrinth" } }
    // Spell Engine's runtime dependencies, dev runs only
    maven { name = "KosmX"; url = "https://maven.kosmx.dev/" }
    maven { name = "Shedaniel"; url = "https://maven.shedaniel.me/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Spell Engine (required; the pack installs it separately) and Spell Power (haste through SpellParameters)
    modImplementation("maven.modrinth:spell-engine:${project.spell_engine_version}") { transitive = false }
    modImplementation("maven.modrinth:spell-power:${project.spell_power_version}") { transitive = false }

    // Dev runs: what Spell Engine needs to boot
    modLocalRuntime("dev.kosmx.player-anim:player-animation-lib-fabric:${project.player_anim_version}") { transitive = false }
    modLocalRuntime("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") { transitive = false }
    // Nested in the Spell Engine and Spell Power jars; the dev run does not unpack it
    modLocalRuntime("maven.modrinth:tiny-config:${project.tiny_config_version}-fabric") { transitive = false }
}

loom {
    runs {
        // Its own folder, so a dev server and a dev client can run side by side.
        server {
            runDir "run-server"
        }
        // `./gradlew runClient -PseeldQuickPlay=localhost:25565` joins a server straight away (HUD screenshots)
        client {
            if (project.hasProperty("seeldQuickPlay")) {
                programArgs "--quickPlayMultiplayer", project.property("seeldQuickPlay").toString(), "--width", "1280", "--height", "720"
            }
        }
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE.txt") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {
    }
}
